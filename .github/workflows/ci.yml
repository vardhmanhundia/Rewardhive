name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          cd apps/backend
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: |
          cd apps/backend
          ruff check src

      - name: Type check with mypy
        run: |
          cd apps/backend
          mypy src

      - name: Run tests
        env:
          # Never call a real LLM in CI: the shared factory returns a fake
          # replay model, so no MODEL_API_KEY is needed.
          LLM_FAKE_MODE: "true"
        run: |
          cd apps/backend
          pytest tests/

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd apps/web
          npm install

      - name: Build
        run: |
          cd apps/web
          npm run build
