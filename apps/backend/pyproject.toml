[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "card-agent-backend"
version = "0.1.0"
description = "Card Agent Backend with FastAPI and LangGraph"
requires-python = ">=3.13"
# Exact pins: open ranges previously pulled incompatible majors
# (SQLAlchemy 2.1, bcrypt 5.0) that broke the build. Keep these pinned.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "langchain==1.4.7",
    "langgraph==1.2.17",
    "pydantic[email]==2.14.1",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "alembic==1.20.1",
    "redis==8.1.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "PyJWT==2.15.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "aiosqlite==0.20.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
