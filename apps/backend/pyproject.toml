[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "card-agent-backend"
version = "0.1.0"
description = "Card Agent Backend with FastAPI and LangGraph"
requires-python = ">=3.13"
# Exact pins: open ranges previously pulled incompatible majors
# (SQLAlchemy 2.1, bcrypt 5.0) that broke the build. Keep these pinned.
dependencies = [
    "fastapi==0.162.0",
    "uvicorn==0.54.0",
    "langchain==1.4.7",
    "langchain-anthropic==1.7.5",
    "langchain-openai==1.7.3",
    "langgraph==1.2.17",
    "langgraph-checkpoint-postgres==3.2.0",
    "langsmith==0.14.12",
    "psycopg[binary,pool]==3.3.6",
    "python-dotenv==1.2.4",
    "pydantic[email]==2.14.1",
    "sqlalchemy[asyncio]==2.1.6",
    "asyncpg==0.30.0",
    "pgvector==0.3.6",
    "alembic==1.20.1",
    "redis==8.1.0",
    "httpx==0.28.1",
    "PyJWT==2.15.1",
    "bcrypt==5.0.0",
    "python-multipart==0.0.32",
    # Self-hosted embeddings for RAG retrieval, behind EmbeddingService. Default
    # provider is sentence-transformers (bge-large-en-v1.5, 1024-dim): native
    # wheels on arm64 / Python 3.13, no emulation. torch is pinned because its
    # cp313 linux-aarch64 wheel is what lets the container build natively.
    "sentence-transformers==6.2.0",
    "torch==2.14.1",
]

[project.optional-dependencies]
# NOTE: Meta's SONAR text encoder (EMBEDDING_PROVIDER=sonar) is NOT a project
# extra. sonar-space==0.5.0 -> fairseq2 pins huggingface-hub<1.0, which is
# irreconcilable with sentence-transformers' huggingface-hub>=1.3.0 above, so
# uv/pip can never resolve it alongside the base deps. It also ships no cp313 /
# linux-arm64 wheel. Install it out-of-band on the x86_64 + Python<=3.12 host
# that needs it, into the project venv, letting it resolve its own torch triple:
#     uv pip install "sonar-space==0.5.0"      # or: pip install "sonar-space==0.5.0"
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "pytest-cov==6.0.0",
    "aiosqlite==0.20.0",
    "black==24.10.0",
    "ruff==0.8.4",
    "mypy==1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.mypy]
# Third-party packages that ship no type stubs / py.typed marker. pgvector is
# installed but untyped; sonar is installed out-of-band only on the SONAR host
# (not a project extra) so it's usually absent — mypy must not fail on either.
[[tool.mypy.overrides]]
module = ["pgvector.*", "sonar.*"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "deepeval>=4.3.2",
    "pytest>=8.3.4",
]
