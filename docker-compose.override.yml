services:
  backend:
    command: sh -c "alembic upgrade head && python -m src.db.seed_cards && uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir src"
    environment:
      - WATCHFILES_FORCE_POLLING=true
    volumes:
      - ./apps/backend/alembic:/app/alembic
      - ./apps/backend/seed:/app/seed

  web:
    command: npm run dev
    environment:
      - VITE_PROXY_TARGET=http://backend:8000
      - VITE_USE_MOCK_CARDS=false
      - CHOKIDAR_USEPOLLING=true
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/vite.config.ts:/app/apps/web/vite.config.ts
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./shared:/app/shared
